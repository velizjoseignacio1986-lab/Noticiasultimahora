<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090711">
  <title>Diego… sorpresa 🎵</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:#090711}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#41156a 0,transparent 45%),radial-gradient(ellipse at 15% 80%,#063d53 0,transparent 40%),#090711}.stars,.stars:before,.stars:after{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 30%,#ffffffcc 40%,transparent 60%),radial-gradient(1px 1px at 70% 20%,#ffffffaa 40%,transparent 60%),radial-gradient(2px 2px at 80% 75%,#ffffffaa 40%,transparent 60%),radial-gradient(1px 1px at 35% 82%,#ffffffcc 40%,transparent 60%);background-size:420px 360px;animation:twinkle 5s ease-in-out infinite alternate}.stars:before,.stars:after{content:"";opacity:.5;transform:translate(120px,80px) scale(1.3);animation-delay:-2s}@keyframes twinkle{to{opacity:.35;transform:translateY(-8px)}}main{position:relative;width:min(900px,calc(100% - 2rem));padding:clamp(1.5rem,5vw,3.5rem);text-align:center;border:1px solid #ffffff25;border-radius:2rem;background:#0b0b14c9;box-shadow:0 25px 100px #0009;backdrop-filter:blur(14px);animation:appear .8s cubic-bezier(.16,1,.3,1) both}@keyframes appear{from{opacity:0;transform:translateY(25px) scale(.97)}to{opacity:1;transform:none}}.tag{color:#d5a5ff;text-transform:uppercase;letter-spacing:.22em;font-size:.75rem;font-weight:900}h1{margin:.5rem 0 1rem;font-size:clamp(3rem,12vw,8rem);line-height:.9;letter-spacing:-.08em;text-shadow:0 0 16px #cf62ff,0 0 52px #9537ff;animation:neon 2s ease-in-out infinite alternate}@keyframes neon{to{text-shadow:0 0 25px #e6a3ff,0 0 80px #9537ff,0 0 110px #543bff}}.subtitle{margin:0 auto 1.5rem;color:#ded9e9;font-size:clamp(1rem,3vw,1.3rem)}.video-frame{width:min(720px,100%);margin:0 auto;overflow:hidden;aspect-ratio:16/9;border:1px solid #ffffff38;border-radius:1rem;background:#000;box-shadow:0 0 36px #a33aff55}.video-frame iframe{width:100%;height:100%;border:0}.hint{margin:1rem 0 0;color:#a9a2b6;font-size:.82rem}button{margin-top:1.2rem;padding:.75rem 1rem;border:1px solid #ffffff38;border-radius:999px;color:#fff;background:#ffffff0b;font:inherit;font-weight:750;cursor:pointer}button:hover{background:#ffffff1a}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <div class="tag">Una sorpresa para ti</div>
    <h1>DIEGO</h1>
    <p class="subtitle">¡Te han rickrolleado! Dale play y disfruta el clásico 🎶</p>
    <div class="video-frame">
      <iframe src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&loop=1&playlist=dQw4w9WgXcQ&controls=1&playsinline=1" title="Rick Astley — Never Gonna Give You Up" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <p class="hint">El autoplay puede iniciar silenciado según la configuración del navegador. Activa el sonido con los controles del video.</p>
    <button type="button" id="soundButton">🔊 Activar sonido</button>
  </main>
  <script>
    document.querySelector('#soundButton').addEventListener('click',()=>{
      const frame=document.querySelector('iframe');
      frame.src='https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&loop=1&playlist=dQw4w9WgXcQ&controls=1&playsinline=1';
      document.querySelector('#soundButton').textContent='🎵 ¡Que disfrutes el clásico!';
    });
  </script>
</body>
</html>
