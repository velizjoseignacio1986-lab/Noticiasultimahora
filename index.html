<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101225">
  <meta name="description" content="Página de broma con tarjetas de recargas para Free Fire, Roblox y Spotify. No es una tienda real.">
  <title>RecargaZone — Recargas para todos</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background: #0c0d18;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #25234b 0, #11121f 45%, #0c0d18 100%); }
    header { border-bottom: 1px solid #ffffff20; background: #10111de8; }
    .nav { width: min(1120px, calc(100% - 2rem)); margin: auto; min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { margin: 0; font-size: 1.4rem; font-weight: 900; letter-spacing: -.04em; }
    .brand span { color: #a78bfa; }
    .demo { color: #c4b5fd; font-size: .82rem; font-weight: 750; }
    main { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; padding: 4rem 0 3rem; }
    .hero { max-width: 720px; margin: 0 auto 2.5rem; text-align: center; }
    .eyebrow { color: #a78bfa; font-size: .8rem; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: .75rem 0; font-size: clamp(2.4rem, 7vw, 4.5rem); line-height: 1; letter-spacing: -.06em; }
    .hero p { margin: 1rem auto 0; max-width: 590px; color: #b6b8ca; font-size: 1.08rem; line-height: 1.65; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2rem; }
    .card { overflow: hidden; padding: 1.5rem; border: 1px solid #ffffff17; border-radius: 1.3rem; background: linear-gradient(150deg, #202136, #151622 70%); box-shadow: 0 18px 55px #0005; }
    .icon { display: grid; width: 58px; height: 58px; place-items: center; border-radius: 17px; font-size: 1.8rem; }
    .freefire .icon { background: #ef444426; }
    .roblox .icon { background: #f8fafc18; }
    .spotify .icon { background: #22c55e26; }
    .card h2 { margin: 1.2rem 0 .45rem; font-size: 1.4rem; }
    .card p { min-height: 48px; margin: 0; color: #b6b8ca; line-height: 1.5; }
    .tag { display: inline-block; margin-top: 1rem; padding: .3rem .6rem; border-radius: 999px; background: #ffffff10; color: #d7d8e4; font-size: .78rem; font-weight: 700; }
    .card button { width: 100%; margin-top: 1.3rem; padding: .85rem 1rem; border: 0; border-radius: .75rem; color: #11121f; background: #c4b5fd; font: inherit; font-weight: 850; cursor: pointer; transition: transform .15s, background .15s; }
    .card button:hover { transform: translateY(-2px); background: #ddd6fe; }
    .card button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    .notice { display: none; max-width: 680px; margin: 1.5rem auto 0; padding: 1rem 1.2rem; border: 1px solid #fbbf2455; border-radius: .9rem; color: #fde68a; background: #fbbf2414; line-height: 1.5; }
    .notice.visible { display: block; }
    .fine-print { margin: 2rem auto 0; color: #85879b; font-size: .85rem; text-align: center; line-height: 1.6; }
    footer { padding: 1.5rem; border-top: 1px solid #ffffff18; color: #85879b; font-size: .85rem; text-align: center; }
    @media (max-width: 760px) { .cards { grid-template-columns: 1fr; } .card p { min-height: 0; } main { padding-top: 3rem; } }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <p class="brand">Recarga<span>Zone</span> ⚡</p>
      <span class="demo">SITIO DE DEMOSTRACIÓN</span>
    </div>
  </header>
  <main>
    <section class="hero" aria-labelledby="page-title">
      <span class="eyebrow">Tu rincón gamer y musical</span>
      <h1 id="page-title">Recarga tu mundo.</h1>
      <p>Elige tu plataforma favorita y encuentra aquí las recargas más increíbles. ¡Diversión para todos!</p>
    </section>
    <section class="cards" aria-label="Plataformas disponibles">
      <article class="card freefire">
        <div class="icon" aria-hidden="true">🔥</div>
        <h2>Free Fire</h2>
        <p>Diamantes para personalizar tu juego y presumir tu estilo.</p>
        <span class="tag">Diamantes</span>
        <button type="button
