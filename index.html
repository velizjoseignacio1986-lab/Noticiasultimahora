<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de Pavos Fortnite Gratis</title>
  <style>
    :root {
      --bg1: #0a0d1a;
      --bg2: #151a2d;
      --panel: rgba(16, 18, 28, 0.9);
      --panel-border: rgba(255,255,255,0.12);
      --green: #7af7a1;
      --green-2: #2ecc71;
      --blue: #56c5ff;
      --red: #ff4d5a;
      --text: #f7f8ff;
      --muted: #b7bfd8;
      --shadow: rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(700px, 100%);
      background: rgba(18, 22, 34, 0.9);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      box-shadow: 0 25px 60px var(--shadow);
      padding: 28px 22px 22px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(86,197,255,0.12), rgba(122,247,161,0.07), rgba(255,77,90,0.08));
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .logo {
      display: inline-block;
      letter-spacing: 0.26em;
      font-weight: 900;
      font-size: 0.8rem;
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      margin-bottom: 14px;
      color: var(--blue);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .subtitle {
      color: var(--muted);
      margin: 12px auto 18px;
      max-width: 560px;
      font-size: 1.02rem;
    }

    .amount-box {
      margin: 20px auto 18px;
      width: min(320px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .label {
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      font-size: 0.75rem;
      margin-bottom: 8px;
    }

    #amount {
      display: block;
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: 900;
      color: var(--green);
      text-shadow: 0 0 18px rgba(122,247,161,0.45);
    }

    button {
      appearance: none;
      border: none;
      background: linear-gradient(180deg, var(--green), var(--green-2));
      color: #0c1411;
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 18px 36px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(46, 204, 113, 0.35);
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.8;
    }

    .status {
      min-height: 32px;
      margin-top: 18px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 0.04em;
    }

    .hidden {
      display: none !important;
    }

    #rickroll {
      margin-top: 16px;
      background: rgba(21, 12, 18, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 18px 18px 12px;
    }

    .rick-banner {
      font-size: clamp(2.1rem, 8vw, 4rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      color: var(--red);
      margin-bottom: 10px;
      text-shadow: 0 0 18px rgba(255,77,90,0.4);
    }

    .rick-message {
      font-size: clamp(1.1rem, 3vw, 1.75rem);
      margin: 0 0 16px;
      color: #fff;
      font-weight: 700;
    }

    iframe {
      width: 100%;
      min-height: 250px;
      border: none;
      border-radius: 14px;
      background: #000;
    }

    body.rick-theme {
      background: radial-gradient(circle at top, #3d0b16, #07070d 60%);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="content">
      <div class="logo">FORTNITE</div>
      <h1>Generador de Pavos</h1>
      <p class="subtitle">Genera tus pavos gratis y disfruta de una recompensa épica.</p>

      <div id="generatorPanel">
        <div class="amount-box">
          <span class="label">Pavos</span>
          <span id="amount">0</span>
        </div>
        <button id="generateBtn" type="button">Generar</button>
      </div>

      <div id="loading" class="status hidden">Generando pavos...</div>

      <div id="rickroll" class="hidden">
        <div class="rick-banner">TE RICK</div>
        <p class="rick-message">Te rickrolleé, Leonardo Pedraza</p>
        <iframe
          src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&controls=1&rel=0&modestbranding=1"
          title="Rick Astley - Never Gonna Give You Up"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <script>
    const generateBtn = document.getElementById('generateBtn');
    const amount = document.getElementById('amount');
    const generatorPanel = document.getElementById('generatorPanel');
    const loading = document.getElementById('loading');
    const rickroll = document.getElementById('rickroll');

    generateBtn.addEventListener('click', () => {
      generateBtn.disabled = true;
      generatorPanel.classList.add('hidden');
      loading.classList.remove('hidden');

      let current = 0;
      const interval = setInterval(() => {
        current += Math.floor(Math.random() * 1800) + 700;
        amount.textContent = current.toLocaleString('es-ES');

        if (current >= 50000) {
          clearInterval(interval);
          setTimeout(() => {
            loading.classList.add('hidden');
            rickroll.classList.remove('hidden');
            document.body.classList.add('rick-theme');
          }, 1000);
        }
      }, 120);
    });
  </script>
</body>
</html>
